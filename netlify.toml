# See https://docs.netlify.com/configure-builds/file-based-configuration/ for all available options

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Deploy contexts
[context.production]
  environment = { SANITY_USE_CDN = "true" }

[context.deploy-preview]
  command = "npm run build:preview"
  environment = { SANITY_USE_CDN = "false" }

[context.branch-deploy]
  command = "npm run build:preview"

# Edge Functions
[[edge_functions]]
  path = "/api/geo"
  function = "geo"

# Regular Functions (serverless)
[[functions]]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@sanity/client"]

# Redirects for SPA fallback (if needed for React islands)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/_functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Additional security headers for sensitive paths
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With"
    Access-Control-Max-Age = "86400"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirect old URLs if needed
# [[redirects]]
#   from = "/old-page"
#   to = "/new-page"
#   status = 301
#   force = true

# Proxy requests to external APIs (optional)
# [[redirects]]
#   from = "/proxy/sanity/*"
#   to = "https://:SANITY_PROJECT_ID.api.sanity.io/v1/:splat"
#   status = 200
#   force = true
#   signed = "COOKIE_SECRET"

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Plugins
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  
  [plugins.inputs]
    output_path = "reports/lighthouse.html"

[[plugins]]
  package = "@netlify/plugin-audit"
  
  [plugins.inputs]
    skip_scripts = false
    inline_sources = true
